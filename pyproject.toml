[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomatoai"
version = "0.1.0"
description = "Tomato-specific plant intelligence and robotics interfaces"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.26", "pandas>=2.0", "pyyaml>=6.0"]
vision = ["torch>=2.2", "opencv-python>=4.8"]
robotics = []
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
include = ["tomatoai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
